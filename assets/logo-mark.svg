<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pianostemmer'n">
  <!-- Ivory badge -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#FAF6EF"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#211D19" stroke-width="1.5"/>
  <!-- Red felt strip (temperament strip) across the string band -->
  <rect x="10" y="13" width="44" height="4.5" rx="2.25" fill="#9E3B2B"/>
  <!-- White-key separations -->
  <g stroke="#211D19" stroke-width="1.5" stroke-linecap="round">
    <line x1="21" y1="44" x2="21" y2="54"/>
    <line x1="32" y1="44" x2="32" y2="54"/>
    <line x1="43" y1="44" x2="43" y2="54"/>
  </g>
  <!-- Ebony keys -->
  <g fill="#211D19">
    <rect x="17.5" y="24" width="7" height="20" rx="1.5"/>
    <rect x="28.5" y="24" width="7" height="20" rx="1.5"/>
    <rect x="39.5" y="24" width="7" height="20" rx="1.5"/>
  </g>
</svg>
